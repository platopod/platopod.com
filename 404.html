<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Plato Pod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0B0E13; --ink:#E7ECF3; --ink-2:#93A0B2; --ink-3:#6B7686; --blue:#3D8BFD; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; line-height:1.6;
  }
  .chrome {
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-3);
  }
  h1 { font-size:30px; font-weight:600; letter-spacing:-.02em; margin:12px 0 10px; }
  p { color:var(--ink-2); max-width:46ch; }
  a { color:var(--blue); text-decoration:none; display:inline-block; margin-top:20px; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div>
    <div class="chrome">Error 404</div>
    <h1>Off the arena</h1>
    <p>That page is not here. The boundary is fitted from the corner markers,
       and this fell outside it.</p>
    <a href="/">Back to platopod.com</a>
  </div>
</body>
</html>
